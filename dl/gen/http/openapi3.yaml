    /oci-file/{repository}:
        get:
            tags:
                - oci
            summary: download-file oci
            operationId: oci#download-file
            parameters:
                - name: tag
                  in: query
                  description: OCI artifact tag
                  allowEmptyValue: true
                  required: true
                  schema:
