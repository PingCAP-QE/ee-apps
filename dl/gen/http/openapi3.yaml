                customer_id:
                    type: string
                    example: psu
                    maxLength: 255
                expires_in_seconds:
                    type: integer
                    example: 86400
                    format: int64
                    minimum: 1
                    maximum: 2.592e+06
                max_sessions:
                    type: integer
                    description: GET authorizations; HEAD never consumes a session
                    example: 5
                    format: int64
                    minimum: 1
                    maximum: 2.147483647e+09
                purpose:
                    type: string
                    example: customer-delivery
                    enum:
                        - customer-delivery
            example:
                artifact:
                    file: leg
                    repository: phc
                    tag: ujw
                customer_id: fgw
                expires_in_seconds: 86400
                max_sessions: 5
                purpose: customer-delivery
            required:
                - artifact
                - purpose
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: false
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: false
            example:
                fault: true
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: false
                timeout: false
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
