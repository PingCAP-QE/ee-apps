            id:
                type: string
                example: Temporibus voluptates voluptas.
            issued_by:
                type: string
                example: Inventore veritatis dolore odit.
            max_sessions:
                type: integer
                example: 4962267788257340667
                format: int64
            purpose:
                type: string
                example: Accusantium molestias tempora dicta facere consequuntur cum.
            revoked_at:
                type: string
                example: Explicabo ea modi in et possimus.
            sessions_started:
