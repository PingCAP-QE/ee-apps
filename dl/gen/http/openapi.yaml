swagger: "2.0"
info:
    title: Download OCI artifacts Service
    description: Service for downloading files from OCI artifact
    version: 0.0.1
host: localhost:8000
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /api/v1/shares:
        post:
            tags:
                - shares
            summary: create shares
            operationId: shares#create
            parameters:
                - name: Authorization
                  in: header
                  required: true
                  type: string
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/SharesCreateRequestBody'
                    required:
                        - artifact
                        - purpose
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Share'
                        required:
                            - id
                            - artifact
                            - issued_by
                            - purpose
                            - created_at
                            - expires_at
                            - sessions_started
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/SharesCreateInvalidRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/SharesCreateUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/SharesCreateForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/SharesCreateNotFoundResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/SharesCreateUnavailableResponseBody'
            schemes:
                - http
            security:
                - issuer_key_header_Authorization: []
    /api/v1/shares/{id}:
        get:
            tags:
                - shares
            summary: show shares
            operationId: shares#show
            parameters:
                - name: id
                  in: path
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Share'
                        required:
                            - id
                            - artifact
                            - issued_by
                            - purpose
                            - created_at
                            - expires_at
                            - sessions_started
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/SharesShowInvalidRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/SharesShowUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/SharesShowForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/SharesShowNotFoundResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/SharesShowUnavailableResponseBody'
            schemes:
                - http
            security:
                - issuer_key_header_Authorization: []
        delete:
            tags:
                - shares
            summary: revoke shares
            operationId: shares#revoke
            parameters:
                - name: id
                  in: path
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/SharesRevokeInvalidRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/SharesRevokeUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/SharesRevokeForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/SharesRevokeNotFoundResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/SharesRevokeUnavailableResponseBody'
            schemes:
                - http
            security:
                - issuer_key_header_Authorization: []
    /gcs-obj/{bucket}/{key}:
        get:
            tags:
                - gcs
            summary: download-object gcs
            operationId: gcs#download-object
            produces:
                - application/octet-stream
            parameters:
                - name: bucket
                  in: path
                  description: bucket name
                  required: true
                  type: string
                - name: key
                  in: path
                  description: object key
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    headers:
                        Content-Disposition:
                            description: Content-Disposition header for downloading
                            type: string
                        Content-Length:
                            description: Length is the downloaded content length in bytes.
                            type: int64
            schemes:
                - http
        head:
            tags:
                - gcs
            summary: head-object gcs
            operationId: gcs#head-object
            parameters:
                - name: bucket
                  in: path
                  description: bucket name
                  required: true
                  type: string
                - name: key
                  in: path
                  description: object key
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    headers:
                        Content-Disposition:
                            description: Content-Disposition header value
                            type: string
                        Content-Length:
                            description: Content length in bytes.
                            type: int64
            schemes:
                - http
    /oci-file-sha256/{repository}:
        get:
            tags:
                - oci
            summary: download-file-sha256 oci
            operationId: oci#download-file-sha256
            produces:
                - application/plain-text
            parameters:
                - name: file
                  in: query
                  description: file name in OCI artifact
                  required: true
                  type: string
                - name: tag
                  in: query
                  description: OCI artifact tag
                  required: true
                  type: string
                - name: repository
                  in: path
                  description: OCI artifact repository
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    headers:
                        Content-Disposition:
                            description: Content-Disposition header for downloading
                            type: string
                        Content-Length:
                            description: Length is the downloaded content length in bytes.
                            type: int64
            schemes:
                - http
    /oci-file/{repository}:
        get:
            tags:
                - oci
            summary: download-file oci
            operationId: oci#download-file
            produces:
                - application/octet-stream
            parameters:
                - name: tag
                  in: query
                  description: OCI artifact tag
                  required: true
                  type: string
                - name: file
                  in: query
                  description: file name in OCI artifact
                  required: false
                  type: string
                - name: file_regex
                  in: query
                  description: file name regex pattern in OCI artifact
                  required: false
                  type: string
                  format: regexp
                - name: repository
                  in: path
                  description: OCI artifact repository
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    headers:
                        Content-Disposition:
                            description: Content-Disposition header for downloading
                            type: string
                        Content-Length:
                            description: Length is the downloaded content length in bytes.
                            type: int64
            schemes:
                - http
        head:
            tags:
                - oci
            summary: head-file oci
            operationId: oci#head-file
            parameters:
                - name: tag
                  in: query
                  description: OCI artifact tag
                  required: true
                  type: string
                - name: file
                  in: query
                  description: file name in OCI artifact
                  required: false
                  type: string
                - name: file_regex
                  in: query
                  description: file name regex pattern in OCI artifact
                  required: false
                  type: string
                  format: regexp
                - name: repository
                  in: path
                  description: OCI artifact repository
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    headers:
                        Content-Disposition:
                            description: Content-Disposition header value
                            type: string
                        Content-Length:
                            description: Content length in bytes.
                            type: int64
            schemes:
                - http
    /oci-files/{repository}:
        get:
            tags:
                - oci
            summary: list-files oci
            operationId: oci#list-files
            parameters:
                - name: tag
                  in: query
                  description: OCI artifact tag
                  required: true
                  type: string
                - name: repository
                  in: path
                  description: OCI artifact repository
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            type: string
                            example: Et non.
            schemes:
                - http
    /s3-obj/{bucket}/{key}:
        get:
            tags:
                - ks3
            summary: download-object ks3
            operationId: ks3#download-object
            produces:
                - application/octet-stream
            parameters:
                - name: bucket
                  in: path
                  description: bucket name
                  required: true
                  type: string
                - name: key
                  in: path
                  description: object key
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    headers:
                        Content-Disposition:
                            description: Content-Disposition header for downloading
                            type: string
                        Content-Length:
                            description: Length is the downloaded content length in bytes.
                            type: int64
            schemes:
                - http
        head:
            tags:
                - ks3
            summary: head-object ks3
            operationId: ks3#head-object
            parameters:
                - name: bucket
                  in: path
                  description: bucket name
                  required: true
                  type: string
                - name: key
                  in: path
                  description: object key
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    headers:
                        Content-Disposition:
                            description: Content-Disposition header value
                            type: string
                        Content-Length:
                            description: Content length in bytes.
                            type: int64
            schemes:
                - http
