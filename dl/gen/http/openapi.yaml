            filename:
                type: string
                example: Voluptas voluptates assumenda quasi ipsa mollitia est.
            manifest_digest:
                type: string
                example: Ut odit quo voluptates facilis.
            media_type:
                type: string
                example: Perspiciatis omnis provident et est.
            repository:
                type: string
                example: Accusantium molestias tempora dicta facere consequuntur cum.
            size:
                type: integer
                example: 5837770085715846635
                format: int64
            source_tag:
                type: string
                example: Earum est et et.
        example:
            blob_digest: Minus illum ut iure.
            filename: Maiores est atque velit.
            manifest_digest: Soluta distinctio qui aut qui.
            media_type: In adipisci magnam.
            repository: Distinctio non dicta adipisci alias et et.
            size: 3546259887199988066
            source_tag: Ipsam et quos consequatur exercitationem officia ullam.
        required:
            - repository
            - source_tag
            - manifest_digest
            - blob_digest
            - filename
            - size
            - media_type
    Share:
        title: Share
        type: object
        properties:
            artifact:
                $ref: '#/definitions/PinnedArtifact'
            created_at:
                type: string
                example: At nulla soluta.
            customer_id:
                type: string
                example: Nihil tenetur.
            download_url:
                type: string
                description: Returned only once, at creation
                example: Atque placeat sunt nostrum reprehenderit sunt.
            expires_at:
                type: string
                example: Animi quas eos id voluptatem neque nihil.
            id:
                type: string
                example: Inventore veritatis dolore odit.
            issued_by:
                type: string
                example: Dolor rerum ab est.
            max_sessions:
                type: integer
                example: 1965566518662805170
                format: int64
            purpose:
                type: string
                example: Perferendis alias iste.
            revoked_at:
                type: string
                example: Qui magni.
            sessions_started:
                type: integer
                example: 4609683565247935685
                format: int64
        example:
            artifact:
                blob_digest: Quam et ut soluta sed minima dolores.
                filename: Autem blanditiis repellendus deserunt.
                manifest_digest: Amet natus quia eos autem eos laudantium.
                media_type: Rerum labore vitae excepturi.
                repository: Autem molestiae.
                size: 8530410839330046368
                source_tag: Et corporis ullam libero voluptatem ut.
            created_at: Molestiae est optio.
            customer_id: Et quisquam eum consectetur ea perferendis non.
            download_url: Et vel doloremque sint sunt necessitatibus et.
            expires_at: Sed itaque officia delectus.
            id: Libero temporibus nisi omnis.
            issued_by: Vel sequi ex tempore.
            max_sessions: 8086904141900767812
            purpose: Deleniti exercitationem vitae harum accusamus.
            revoked_at: Dolorum corrupti quibusdam quam.
            sessions_started: 9124907572916215376
        required:
            - id
            - artifact
            - issued_by
            - purpose
            - created_at
            - expires_at
            - sessions_started
    ShareArtifact:
        title: ShareArtifact
        type: object
        properties:
            file:
                type: string
                example: mac
                maxLength: 255
            repository:
                type: string
                example: z6g
                maxLength: 512
            tag:
                type: string
                example: iay
                maxLength: 128
        example:
            file: e52
            repository: qbt
            tag: 57d
        required:
            - repository
            - tag
            - file
    SharesCreateForbiddenResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
