            manifest_digest:
                type: string
                example: Minima itaque vitae sapiente dolorem in.
            media_type:
                type: string
                example: Non excepturi quos aut qui.
            repository:
                type: string
                example: Dolore amet autem atque quae.
            size:
                type: integer
                example: 5358388934355161946
                format: int64
            source_tag:
                type: string
                example: Labore non quidem dolorem.
        example:
            blob_digest: At natus.
            filename: Ut omnis.
            manifest_digest: Et voluptate illum fuga.
            media_type: Nulla consequatur aut aliquid sunt.
            repository: Fugit rerum quis libero mollitia.
            size: 8827538938178416997
            source_tag: Repellat id ducimus deserunt quos magni.
        required:
            - repository
            - source_tag
            - manifest_digest
            - blob_digest
            - filename
            - size
            - media_type
