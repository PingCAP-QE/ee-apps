swagger: "2.0"
info:
    title: GitHub Token Broker
    description: Mints least-privilege GitHub App installation tokens for CI workloads.
    version: 0.1.0
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /healthz:
        get:
            tags:
                - token
            summary: healthz token
            description: Liveness check.
            operationId: token#healthz
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /readyz:
        get:
            tags:
                - token
            summary: readyz token
            description: Readiness check.
            operationId: token#readyz
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/TokenReadyzNotReadyResponseBody'
            schemes:
                - http
    /v1/token:
        post:
            tags:
                - token
            summary: issue token
            description: Issue a GitHub App installation token.
            operationId: token#issue
            parameters:
                - name: IssueRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/TokenPayload'
                    required:
                        - repo
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/TokenResult'
                        required:
                            - token
                            - source
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/TokenIssueBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/TokenIssueUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/TokenIssueForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/TokenIssueNotFoundResponseBody'
                "429":
                    description: Too Many Requests response.
                    schema:
                        $ref: '#/definitions/TokenIssueRateLimitedResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/definitions/TokenIssueUpstreamResponseBody'
                "504":
                    description: Gateway Timeout response.
                    schema:
                        $ref: '#/definitions/TokenIssueTimeoutResponseBody'
            schemes:
                - http
definitions:
    TokenIssueBadRequestResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: true
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: true
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: false
        description: Invalid request. (default view)
        example:
            fault: true
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: true
            timeout: true
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    TokenIssueForbiddenResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: false
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: false
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: true
        description: Caller is not allowed to request this token. (default view)
        example:
            fault: true
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: false
            timeout: false
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    TokenIssueNotFoundResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: true
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: false
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: true
        description: The GitHub App is not installed for the repository. (default view)
        example:
            fault: true
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: false
            timeout: true
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    TokenIssueRateLimitedResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: false
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: true
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: false
        description: The caller exceeded the request limit. (default view)
        example:
            fault: true
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: false
            timeout: false
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    TokenIssueTimeoutResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: true
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: false
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: true
        description: The GitHub API request timed out. (default view)
        example:
            fault: false
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: true
            timeout: false
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    TokenIssueUnauthorizedResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: false
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: false
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: false
        description: Caller is not authenticated. (default view)
        example:
            fault: false
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: true
            timeout: true
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    TokenIssueUpstreamResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: true
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: false
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: false
        description: The GitHub API request failed. (default view)
        example:
            fault: true
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: false
            timeout: false
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    TokenPayload:
        title: TokenPayload
        type: object
        properties:
            permissions:
                type: object
                description: Optional GitHub permissions subset.
                example:
                    Et illum ea iure quia.: Qui optio tempore quibusdam.
                    Quia reiciendis nihil voluptatem officiis labore dolorum.: Error quas totam.
                    Vero sed.: Sint libero delectus eligendi quod assumenda molestiae.
                additionalProperties:
                    type: string
                    example: Aut ut optio omnis accusantium et.
            repo:
                type: string
                description: Target repository in owner/name form.
                example: example-org/example-repo
                pattern: ^[^/]+/[^/]+$
            repositories:
                type: array
                items:
                    type: string
                    example: Deleniti at similique aut dolor natus.
                description: Optional repository names to narrow the token to.
                example:
                    - Est cumque laborum amet fugiat.
                    - Ut ut.
                    - Doloremque provident maxime enim.
        example:
            permissions:
                Natus dolores in.: Et suscipit et aut esse aut dolor.
            repo: example-org/example-repo
            repositories:
                - Officia nulla sit quis.
                - Sunt omnis et quod accusantium.
        required:
            - repo
    TokenReadyzNotReadyResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: true
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: true
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: false
        description: The service is not ready to serve requests. (default view)
        example:
            fault: false
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: true
            timeout: false
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    TokenResult:
        title: TokenResult
        type: object
        properties:
            expires_at:
                type: string
                description: Token expiry (RFC3339).
                example: "1976-01-24T11:13:13Z"
                format: date-time
            installation_id:
                type: integer
                description: GitHub App installation ID.
                example: 707457308014798639
                format: int64
            source:
                type: string
                description: Token source.
                example: app
                enum:
                    - app
                    - pat
            token:
                type: string
                description: Installation access token.
                example: Praesentium magni corporis consectetur est rerum.
        example:
            expires_at: "1982-07-27T07:23:50Z"
            installation_id: 9043225374409243838
            source: pat
            token: In rerum molestiae dolorem.
        required:
            - token
            - source
