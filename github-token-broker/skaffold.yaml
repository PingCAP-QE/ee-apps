apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: github-token-broker

build:
  platforms: ["linux/amd64", "linux/arm64"]
  artifacts:
    - image: github-token-broker
      ko:
        # Run as UID 65532 by default so Kubernetes runAsNonRoot checks pass.
        fromImage: gcr.io/distroless/static:nonroot
        main: ./cmd/broker
        dependencies:
          paths:
            - "**/*.go"
            - "go.mod"
            - "go.sum"
        flags:
          - -trimpath
        labels:
          org.opencontainers.image.description: In-cluster GitHub App token broker
          org.opencontainers.image.licenses: MIT
          org.opencontainers.image.source: https://github.com/PingCAP-QE/ee-apps
  local:
    useDockerCLI: true
    useBuildkit: true
    concurrency: 0
