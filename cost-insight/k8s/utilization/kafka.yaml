# Standalone Tencent opt-in example; not included in any automatic deployment.
# Apply only via reviewed Tencent GitOps after runtime/ACL/capacity canaries.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: tencent-utilization-tasks
  namespace: kafka
  labels:
    strimzi.io/cluster: cluster-cd
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 172800000
    retention.bytes: 268435456
    cleanup.policy: delete
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: tencent-utilization-worker
  namespace: kafka
  labels:
    strimzi.io/cluster: cluster-cd
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: tencent-utilization-tasks
          patternType: literal
        operations: [Describe, Read, Write]
      - resource:
          type: group
          name: tencent-utilization-workers
          patternType: literal
        operations: [Read]
