# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: EE Portal - test
on:
  pull_request:
    branches: [main]
    paths:
      - experiments/portal/**
      - .github/workflows/ci-ee-portal.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/portal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/portal/package-lock.json
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00d # v6.0.0
        with:
          go-version: '1.24'
      - run: npm ci
      - run: cd cmd/portal-config && go run . --input ../../testdata/modules --output ../../public/config/registry.json --check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
