name: authzd
on:
  pull_request:
    branches: [main]
    paths:
      - "authzd/**"
      - ".github/workflows/ci-authzd.yaml"
  push:
    branches: [main]
    paths:
      - "authzd/**"
      - ".github/workflows/ci-authzd.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: authzd/go.mod
          cache-dependency-path: authzd/go.mod
      - name: Install OpenFGA CLI v0.8.2
        run: |
          go install github.com/openfga/cli/cmd/fga@v0.8.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate and test the pinned authorization model
        working-directory: authzd
        run: |
          fga model validate --file models/authorization.fga
          fga model test --allow-external-files --tests tests/authorization.fga.yaml
      - name: Test registry and policy samples
        working-directory: authzd
        run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce authorization-core coverage
        working-directory: authzd
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '$1 == "total:" { gsub("%", "", $3); print $3 }')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) { printf "coverage %.1f%% is below 80%%\n", coverage; exit 1 } }'
