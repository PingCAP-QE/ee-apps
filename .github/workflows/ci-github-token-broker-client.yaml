name: Test - github-token-broker client

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci-github-token-broker-client.yaml
      - "github-token-broker/client/**"
  push:
    branches:
      - main
    paths:
      - "github-token-broker/client/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test github-token-broker client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: github-token-broker/client
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: github-token-broker/client/go.mod
      - name: Run tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
