name: Test and Build - delivery-approval

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-delivery-approval.yaml
      - delivery-approval/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      tidb:
        image: pingcap/tidb:v8.5.8
        ports: [4000:4000]
    defaults:
      run:
        working-directory: delivery-approval
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Run tests/build with the current toolchain. Ent v0.14.6's generator
          # does not support Go 1.27 export data, so the generate step pins
          # GOTOOLCHAIN=go1.25.8 explicitly (see internal/database/generate.go).
          go-version: "1.27.3"
          cache-dependency-path: delivery-approval/go.sum
      - name: Wait for TiDB
        run: |
          for _ in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/4000) 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Test including TiDB approval state
        env:
          DL_APPROVAL_TEST_TIDB_DSN: root@tcp(127.0.0.1:4000)/test?parseTime=true&loc=UTC
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.3
      - name: Check chart ports match the service config
        run: |
          set -euo pipefail
          # The chart must not drift from the ports the binary binds; helm lint
          # cannot see this.
          chart=../charts/delivery-approval
          manifest=$(mktemp)
          helm template release "$chart" > "$manifest"
          listen=$(sed -n 's/^ *listen: *"*:\([0-9][0-9]*\)"*$/\1/p' "$chart/values.yaml")
          health=$(sed -n 's/^ *health_address: *"*:\([0-9][0-9]*\)"*$/\1/p' "$chart/values.yaml")
          for port in "$listen" "$health"; do
            grep -q "containerPort: $port" "$manifest" || {
              echo "chart has no containerPort $port"; exit 1; }
          done
          # liveness + readiness both point at the health port.
          [ "$(grep -c "port: $health" "$manifest")" -ge 2 ] || {
            echo "probes are not wired to health port $health"; exit 1; }
      - name: Check generated APIs
        run: |
          go generate ./...
          git diff --exit-code -- internal/database/ent
