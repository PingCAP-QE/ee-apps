# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test and Build - tibuild-v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci-tibuild-v2.yaml
      - "tibuild/**/*.go"
      - "tibuild/**/go.mod"
      - "tibuild/**/go.sum"
      - "github-token-broker/client/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build tibuild
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: "0"
          fetch-tags: "true"
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tibuild/go.mod

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        working-directory: tibuild
        run: |
          go test -v ./...
      - name: Run builds
        working-directory: tibuild
        run: |
          go build ./cmd/tibuild && \
          go build ./cmd/tibuild-cli && \
          go build ./cmd/tibuild-worker
