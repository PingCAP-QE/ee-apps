apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: exp-tibuild-v2

build:
  platforms: ["linux/amd64", "linux/arm64"]
  artifacts:
    - image: exp-tibuild-v2
      ko:
        fromImage: gcr.io/distroless/static
        main: ./cmd/tibuild
        dependencies:
          paths:
            - "**/*.go"
            - "go.mod"
            - "go.sum"
        flags:
          - -trimpath # Ko build flags (optional)
          - -v
        labels:
          org.opencontainers.image.description: PingCAP Build Tool
          org.opencontainers.image.licenses: MIT License
          org.opencontainers.image.source: https://github.com/PingCAP-QE/ee-apps
    - image: exp-tibuild-worker
      ko:
        # The worker shells out to `tiup mirror publish`; distroless/static has
        # no tiup binary. Reuse the publisher worker base, which ships tiup.
        fromImage: ghcr.io/pingcap-qe/cd/utils/release:v2026.10.26-10-g6670bb5
        main: ./cmd/tibuild-worker
        dependencies:
          paths:
            - "**/*.go"
            - "go.mod"
            - "go.sum"
        flags:
          - -trimpath
          - -v
        labels:
          org.opencontainers.image.description: PingCAP Build Worker
          org.opencontainers.image.licenses: MIT License
          org.opencontainers.image.source: https://github.com/PingCAP-QE/ee-apps
