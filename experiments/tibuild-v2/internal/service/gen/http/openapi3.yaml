        get:
            tags:
                - artifact
            summary: listImageSyncTasks artifact
            description: List image sync tasks with pagination and status filter
            operationId: artifact#listImageSyncTasks
            parameters:
                - name: page
                  in: query
                  description: The page number of items
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: The page number of items
                    default: 1
                    example: 748734727528482128
                    format: int64
                  example: 5763653474226022961
                - name: pageSize
                  in: query
                  description: Page size
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Page size
                    default: 30
                    example: 8969549111799334785
                    format: int64
                  example: 3034024988171342521
                - name: status
                  in: query
                  description: Filter by task status (PENDING, PROCESSING, SUCCEEDED, FAILED)
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Filter by task status (PENDING, PROCESSING, SUCCEEDED, FAILED)
                    example: PROCESSING
                    enum:
                        - PENDING
                        - PROCESSING
                        - SUCCEEDED
                        - FAILED
                  example: FAILED
                - name: sort
                  in: query
                  description: What to sort results by
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: What to sort results by
                    default: createdAt
                    example: createdAt
                    enum:
                        - createdAt
                        - updatedAt
                  example: createdAt
                - name: direction
                  in: query
                  description: The direction of the sort
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: The direction of the sort
                    default: desc
                    example: asc
                    enum:
                        - asc
                        - desc
                  example: asc
