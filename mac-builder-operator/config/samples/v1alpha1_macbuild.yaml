apiVersion: tibuild.pingcap.net/v1alpha1
kind: MacBuild
metadata:
  labels:
    app.kubernetes.io/name: mac-builder-operator
    app.kubernetes.io/managed-by: kustomize
  name: macbuild-sample
spec:
  source:
    gitRepository: https://github.com/pingcap/tidb.git
    gitRef: main
    # Optional: Secret in this namespace with git credentials for private-repo
    # clones (kubernetes.io/basic-auth or kubernetes.io/ssh-auth).
    # gitSecretRef: github-git-credentials
    # Optional: initialize git submodules after checkout (default true).
    # submodules: true
  build:
    component: tidb
    version: nightly
    profile: release
  artifacts:
    push: false
