---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: macbuilds.tibuild.pingcap.net
spec:
  group: tibuild.pingcap.net
  names:
    kind: MacBuild
    listKind: MacBuildList
    plural: macbuilds
    singular: macbuild
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The current build status
      jsonPath: .status.phase
      name: Status
      type: string
    - description: Assigned MacAgent
      jsonPath: .status.assignment.agentName
      name: Agent
      type: string
    - description: Build architecture
      jsonPath: .spec.build.arch
      name: Arch
      type: string
    - description: Git Ref
      jsonPath: .spec.source.gitRef
      name: GitRef
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MacBuild is the Schema for the macbuilds API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MacBuildSpec defines the desired state of MacBuild
            properties:
              artifacts:
                description: Artifacts defines where and how to publish the build
                  output
                properties:
                  push:
                    default: false
                    description: Whether to push artifacts to the registry
                    type: boolean
                  registry:
                    default: hub.pingcap.net
                    description: Target registry (e.g., hub.pingcap.net)
                    type: string
                type: object
              build:
                description: Build defines the parameters for the build process
                properties:
                  arch:
                    default: amd64
                    description: Architecture to build for (e.g., amd64, arm64)
                    enum:
                    - amd64
                    - arm64
                    type: string
                  component:
                    description: |-
                      Component to build (e.g., tidb, tikv)
                      This value becomes a directory name and is embedded in the build script the
                      worker executes, so it is restricted to a DNS label.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  os:
                    default: darwin
                    description: OS to build for.
                    type: string
                  profile:
                    default: release
                    description: Build profile (e.g., release, failpoint)
                    type: string
                  version:
                    description: Version string to release (e.g., v1.2.3, nightly)
                    type: string
                required:
                - component
                - version
                type: object
              source:
                description: Source defines the code to be built
                properties:
                  gitRef:
                    description: |-
                      Git ref (branch or tag) (e.g., main, v1.0.0)
                      Must start with an alphanumeric character, so it can never be mistaken for
                      a `git checkout` option.
                    maxLength: 255
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._/+~^-]*$
                    type: string
                  gitRefspec:
                    description: 'Optional: A git refspec to fetch before checkout
                      (e.g., refs/pull/123/head)'
                    maxLength: 255
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._/*~^:{}@+-]*$
                    type: string
                  gitRepository:
                    description: |-
                      Git repository URL (e.g., https://github.com/user/repo.git)
                      Only http(s), ssh and git transports are accepted, and the value may not
                      begin with "-": the value becomes a `git clone` argument on the macOS
                      worker, where a leading dash would be parsed as an option.
                    maxLength: 2048
                    pattern: ^((https?|ssh|git)://[^[:space:]-][^[:space:]]*|git@[A-Za-z0-9._-]+:[^[:space:]]+)$
                    type: string
                  gitSecretRef:
                    description: |-
                      Optional: Name of a Secret in the MacBuild's namespace that holds the git
                      credentials used to clone private repositories. Supported secret shapes:
                      a `kubernetes.io/basic-auth` Secret (username/password), a `token` key, a
                      packed `.git-credentials` key, or a `kubernetes.io/ssh-auth` Secret /
                      ssh key files (`ssh-privatekey`, `id_ed25519`, `id_rsa`, `known_hosts`,
                      `config`, ...). When empty, the clone is anonymous (public repositories).
                    type: string
                  gitSha:
                    description: |-
                      Optional: A specific git commit SHA to check out. Overrides gitRef if provided.
                      (Maps to Tekton git-sha param)
                    pattern: ^[0-9a-f]{7,40}$
                    type: string
                  submodules:
                    description: |-
                      Optional: Initialize git submodules after checkout
                      (`git submodule update --init --recursive`), mirroring the Tekton
                      pingcap-git-clone `submodules` param (which defaults to true). When nil,
                      submodules are initialized (the default); set to false to skip them, e.g.
                      for repositories whose submodules are not needed.
                    type: boolean
                required:
                - gitRef
                - gitRepository
                type: object
              ttl:
                description: |-
                  Duration to retain the build resource after it has finished (succeeded or failed).
                  After this time, it will be automatically deleted. If unset, it will be kept indefinitely.
                type: string
                x-kubernetes-validations:
                - message: ttl must be a valid, non-negative duration (e.g. 1h, 90m)
                  rule: duration(self) >= duration('0s')
              workerSelector:
                additionalProperties:
                  type: string
                description: |-
                  WorkerSelector selects MacAgent label values that a worker must match to
                  run this build. All entries must match the MacAgent's metadata labels.
                maxProperties: 16
                type: object
            required:
            - artifacts
            - build
            - source
            type: object
          status:
            description: MacBuildStatus defines the observed state of MacBuild
            properties:
              assignment:
                description: |-
                  Assignment records the scheduler decision that placed this build on a
                  MacAgent. It remains set after the build reaches a terminal phase for audit.
                properties:
                  agentName:
                    description: AgentName is the MacAgent name that owns this build.
                    type: string
                  agentUID:
                    description: AgentUID is the UID of the MacAgent at assignment
                      time.
                    type: string
                  assignedAt:
                    description: AssignedAt is when the scheduler assigned the build.
                    format: date-time
                    type: string
                  attempt:
                    description: Attempt is the current assignment attempt number.
                    format: int32
                    type: integer
                  leaseDeadline:
                    description: |-
                      LeaseDeadline is when the scheduler may reassign a build that has not
                      started (still Assigned) yet.
                    format: date-time
                    type: string
                  restarts:
                    description: Restarts is the number of times the agent reran the
                      build after a restart.
                    format: int32
                    type: integer
                required:
                - agentName
                - assignedAt
                - attempt
                type: object
              assignmentAttempts:
                description: |-
                  AssignmentAttempts is the total number of scheduling attempts across
                  reassignments. It survives clearing Assignment while a build returns to Pending.
                format: int32
                type: integer
              commitHash:
                description: The actual Git Commit SHA that was checked out
                type: string
              completionTime:
                description: Timestamp when the build process completed (used for
                  GC)
                format: date-time
                type: string
              logs:
                description: Logs describes the build log available through the log
                  service.
                properties:
                  available:
                    description: Available is true once at least one log chunk has
                      been stored.
                    type: boolean
                  command:
                    description: Command is a copy-pasteable command to read the log.
                    type: string
                  complete:
                    description: Complete is true once the agent finalized the log.
                    type: boolean
                  sizeBytes:
                    description: SizeBytes is the number of stored log bytes.
                    format: int64
                    type: integer
                  updatedAt:
                    description: UpdatedAt is when the log was last updated.
                    format: date-time
                    type: string
                required:
                - available
                type: object
              message:
                description: A detailed error or terminal message about the current
                  status.
                type: string
              outputs:
                description: URLs of the final artifacts after completion
                properties:
                  pushed_artifacts_yaml:
                    type: string
                type: object
              phase:
                description: Current phase of the build (Pending, Assigned, Preparing,
                  Building, Publishing, Succeeded, Failed)
                enum:
                - Pending
                - Assigned
                - Preparing
                - Building
                - Publishing
                - Succeeded
                - Failed
                type: string
              phaseHistory:
                description: Ordered history of phase transitions for this build.
                items:
                  description: MacBuildPhaseHistoryEntry records a phase transition
                    for a build.
                  properties:
                    message:
                      description: Optional message recorded for the phase transition.
                      type: string
                    phase:
                      description: Phase entered at this point in time.
                      enum:
                      - Pending
                      - Assigned
                      - Preparing
                      - Building
                      - Publishing
                      - Succeeded
                      - Failed
                      type: string
                    transitionTime:
                      description: TransitionTime is when the phase was first observed.
                      format: date-time
                      type: string
                  required:
                  - phase
                  - transitionTime
                  type: object
                type: array
              phaseMessage:
                description: A short message describing the current phase.
                type: string
              startTime:
                description: Timestamp when the build process started
                format: date-time
                type: string
              workerArch:
                description: The CPU architecture of the macOS worker that is processing
                  this build
                enum:
                - amd64
                - arm64
                type: string
              workerID:
                description: The ID of the macOS worker that is processing this build
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
