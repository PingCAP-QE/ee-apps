<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a delivery link</title>
</head>
<body>
  <main>
    <h1>Request a delivery link</h1>
    <p>Signed in as <strong>{{.Identity.Email}}</strong>.</p>

    {{if .Error}}<p role="alert"><strong>Error:</strong> {{.Error}}</p>{{end}}

    <form method="post" action="{{.Base}}/requests" autocomplete="off">
      <input type="hidden" name="csrf" value="{{.CSRF}}">

      <p>
        <label for="repository">OCI repository</label><br>
        <input id="repository" name="repository" maxlength="512" required
               value="{{.Form.Repository}}" placeholder="us-docker.pkg.dev/project/hub/package">
      </p>

      <p>
        <label for="tag">Tag</label><br>
        <input id="tag" name="tag" maxlength="128" required
               value="{{.Form.Tag}}" placeholder="v8.1.0_linux_amd64">
      </p>

      <p>
        <label for="files">Files (one filename per line, 1–10)</label><br>
        <textarea id="files" name="files" rows="5" cols="60" required
                  placeholder="tidb.tar.gz">{{.Form.Files}}</textarea>
      </p>

      <p>
        <label for="ttl">TTL</label><br>
        <select id="ttl" name="ttl">
          {{- range .TTLOptions}}
          <option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>
          {{- end}}
        </select>
        <input id="ttl_custom" name="ttl_custom" maxlength="32" value="{{.Form.TTLCustom}}"
               placeholder="customize: 1h30m / 90s">
        <br>
        <small>The custom value overrides the selection; units
          <code>h</code>/<code>m</code>/<code>s</code>, max {{.MaxTTL}}</small>
      </p>

      <p>
        <label for="note">Purpose / customer note (optional)</label><br>
        <textarea id="note" name="note" rows="3" cols="60" maxlength="1024">{{.Form.Note}}</textarea>
      </p>

      <button type="submit">Submit for approval</button>
    </form>

    <p><a href="{{.Base}}/requests">My requests</a></p>
  </main>
</body>
</html>
