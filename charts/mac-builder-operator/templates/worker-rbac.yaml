{{- if .Values.worker.create -}}
{{- $fullname := include "mac-builder-operator.fullname" . -}}
{{- $workerNS := default (include "mac-builder-operator.macBuildNamespace" .) .Values.worker.serviceAccount.namespace -}}
{{- $workerSA := default (printf "%s-worker" $fullname) .Values.worker.serviceAccount.name -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $workerSA }}
  namespace: {{ $workerNS }}
  labels:
    {{- include "mac-builder-operator.labels" . | nindent 4 }}
  {{- with .Values.worker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-worker-macagent
  labels:
    {{- include "mac-builder-operator.labels" . | nindent 4 }}
rules:
  # MacAgent is cluster-scoped, so self-registration and heartbeat updates need
  # a ClusterRole even though the worker's MacBuild access stays namespaced.
  - apiGroups:
      - tibuild.pingcap.net
    resources:
      - macagents
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - tibuild.pingcap.net
    resources:
      - macagents/status
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-worker-macagent
  labels:
    {{- include "mac-builder-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-worker-macagent
subjects:
  - kind: ServiceAccount
    name: {{ $workerSA }}
    namespace: {{ $workerNS }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-worker
  namespace: {{ $workerNS }}
  labels:
    {{- include "mac-builder-operator.labels" . | nindent 4 }}
rules:
  # Writes stay scoped to the namespace where MacBuilds live.
  - apiGroups:
      - tibuild.pingcap.net
    resources:
      - macbuilds
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - tibuild.pingcap.net
    resources:
      - macbuilds/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - tibuild.pingcap.net
    resources:
      - macbuilds/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Read the git credentials Secrets referenced by builds (source.gitSecretRef)
  # to clone private repositories. The worker Role is namespaced, so this is
  # confined to the MacBuild namespace.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  # Upload build logs through the API server service proxy. `create` is
  # required for PUT; the worker Role keeps it namespace-scoped.
  - apiGroups:
      - ""
    resources:
      - services/proxy
    verbs:
      - get
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-worker
  namespace: {{ $workerNS }}
  labels:
    {{- include "mac-builder-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ $workerSA }}
    namespace: {{ $workerNS }}
{{- end }}
