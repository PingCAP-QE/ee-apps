{{- if .Values.crd.create -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: macbuilds.tibuild.pingcap.net
  labels:
    {{- include "mac-builder-operator.labels" . | nindent 4 }}
spec:
  group: tibuild.pingcap.net
  names:
    kind: MacBuild
    listKind: MacBuildList
    plural: macbuilds
    singular: macbuild
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The current build status
      jsonPath: .status.phase
      name: Status
      type: string
    - description: Assigned MacAgent
      jsonPath: .status.assignment.agentName
      name: Agent
      type: string
    - description: Build architecture
      jsonPath: .spec.build.arch
      name: Arch
      type: string
    - description: Git Ref
      jsonPath: .spec.source.gitRef
      name: GitRef
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MacBuild is the Schema for the macbuilds API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MacBuildSpec defines the desired state of MacBuild
            properties:
              artifacts:
                description: Artifacts defines where and how to publish the build
                  output
                properties:
                  push:
                    default: false
                    description: Whether to push artifacts to the registry
                    type: boolean
                  registry:
                    default: hub.pingcap.net
                    description: Target registry (e.g., hub.pingcap.net)
                    type: string
                type: object
              build:
                description: Build defines the parameters for the build process
                properties:
                  arch:
                    default: amd64
                    description: Architecture to build for (e.g., amd64, arm64)
                    enum:
                    - amd64
                    - arm64
                    type: string
                  component:
                    description: Component to build (e.g., tidb, tikv)
                    type: string
                  os:
                    default: darwin
                    description: OS to build for.
                    type: string
                  profile:
                    default: release
                    description: Build profile (e.g., release, failpoint)
                    type: string
                  version:
                    description: Version string to release (e.g., v1.2.3, nightly)
                    type: string
                required:
                - component
                - version
                type: object
              source:
                description: Source defines the code to be built
                properties:
                  gitRef:
                    description: Git ref (branch or tag) (e.g., main, v1.0.0)
                    type: string
                  gitRefspec:
                    description: 'Optional: A git refspec to fetch before checkout
                      (e.g., refs/pull/123/head)'
                    type: string
                  gitRepository:
                    description: Git repository URL (e.g., https://github.com/user/repo.git)
                    type: string
                  gitSecretRef:
                    description: |-
                      Optional: Name of a Secret in the MacBuild's namespace that holds the git
                      credentials used to clone private repositories. Supported secret shapes:
                      a `kubernetes.io/basic-auth` Secret (username/password), a `token` key, a
                      packed `.git-credentials` key, or a `kubernetes.io/ssh-auth` Secret /
                      ssh key files (`ssh-privatekey`, `id_ed25519`, `id_rsa`, `known_hosts`,
                      `config`, ...). When empty, the clone is anonymous (public repositories).
                    type: string
                  gitSha:
                    description: |-
                      Optional: A specific git commit SHA to check out. Overrides gitRef if provided.
                      (Maps to Tekton git-sha param)
                    type: string
                  submodules:
                    description: |-
                      Optional: Initialize git submodules after checkout
                      (`git submodule update --init --recursive`), mirroring the Tekton
                      pingcap-git-clone `submodules` param (which defaults to true). When nil,
                      submodules are initialized (the default); set to false to skip them, e.g.
                      for repositories whose submodules are not needed.
                    type: boolean
                required:
                - gitRef
                - gitRepository
                type: object
              ttl:
                description: |-
                  Duration to retain the build resource after it has finished (succeeded or failed).
                  After this time, it will be automatically deleted. If unset, it will be kept indefinitely.
                type: string
                x-kubernetes-validations:
                - message: ttl must be a valid, non-negative duration (e.g. 1h, 90m)
                  rule: duration(self) >= duration('0s')
              workerSelector:
                additionalProperties:
                  type: string
                description: |-
                  WorkerSelector selects MacAgent label values that a worker must match to
                  run this build. All entries must match the MacAgent's metadata labels.
                maxProperties: 16
                type: object
            required:
            - artifacts
            - build
            - source
            type: object
          status:
            description: MacBuildStatus defines the observed state of MacBuild
            properties:
              assignment:
                description: |-
                  Assignment records the scheduler decision that placed this build on a
                  MacAgent. It remains set after the build reaches a terminal phase for audit.
                properties:
                  agentName:
                    description: AgentName is the MacAgent name that owns this build.
                    type: string
                  agentUID:
                    description: AgentUID is the UID of the MacAgent at assignment
                      time.
                    type: string
                  assignedAt:
                    description: AssignedAt is when the scheduler assigned the build.
                    format: date-time
                    type: string
                  attempt:
                    description: Attempt is the current assignment attempt number.
                    format: int32
                    type: integer
                  leaseDeadline:
                    description: |-
                      LeaseDeadline is when the scheduler may reassign a build that has not
                      started (still Assigned) yet.
                    format: date-time
                    type: string
                  restarts:
                    description: Restarts is the number of times the agent reran the
                      build after a restart.
                    format: int32
                    type: integer
                required:
                - agentName
                - assignedAt
                - attempt
                type: object
              assignmentAttempts:
                description: |-
                  AssignmentAttempts is the total number of scheduling attempts across
                  reassignments. It survives clearing Assignment while a build returns to Pending.
                format: int32
                type: integer
              commitHash:
                description: The actual Git Commit SHA that was checked out
                type: string
              completionTime:
                description: Timestamp when the build process completed (used for
                  GC)
                format: date-time
                type: string
              logs:
                description: Logs describes the build log available through the log
                  service.
                properties:
                  available:
                    description: Available is true once at least one log chunk has
                      been stored.
                    type: boolean
                  command:
                    description: Command is a copy-pasteable command to read the log.
                    type: string
                  complete:
                    description: Complete is true once the agent finalized the log.
                    type: boolean
                  sizeBytes:
                    description: SizeBytes is the number of stored log bytes.
                    format: int64
                    type: integer
                  updatedAt:
                    description: UpdatedAt is when the log was last updated.
                    format: date-time
                    type: string
                required:
                - available
                type: object
              message:
                description: A detailed error or terminal message about the current
                  status.
                type: string
              outputs:
                description: URLs of the final artifacts after completion
                properties:
                  pushed_artifacts_yaml:
                    type: string
                type: object
              phase:
                description: Current phase of the build (Pending, Assigned, Preparing,
                  Building, Publishing, Succeeded, Failed)
                enum:
                - Pending
                - Assigned
                - Preparing
                - Building
                - Publishing
                - Succeeded
                - Failed
                type: string
              phaseHistory:
                description: Ordered history of phase transitions for this build.
                items:
                  description: MacBuildPhaseHistoryEntry records a phase transition
                    for a build.
                  properties:
                    message:
                      description: Optional message recorded for the phase transition.
                      type: string
                    phase:
                      description: Phase entered at this point in time.
                      enum:
                      - Pending
                      - Assigned
                      - Preparing
                      - Building
                      - Publishing
                      - Succeeded
                      - Failed
                      type: string
                    transitionTime:
                      description: TransitionTime is when the phase was first observed.
                      format: date-time
                      type: string
                  required:
                  - phase
                  - transitionTime
                  type: object
                type: array
              phaseMessage:
                description: A short message describing the current phase.
                type: string
              startTime:
                description: Timestamp when the build process started
                format: date-time
                type: string
              workerArch:
                description: The CPU architecture of the macOS worker that is processing
                  this build
                enum:
                - amd64
                - arm64
                type: string
              workerID:
                description: The ID of the macOS worker that is processing this build
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: macagents.tibuild.pingcap.net
  labels:
    {{- include "mac-builder-operator.labels" . | nindent 4 }}
spec:
  group: tibuild.pingcap.net
  names:
    kind: MacAgent
    listKind: MacAgentList
    plural: macagents
    shortNames:
    - ma
    singular: macagent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Heartbeat and maintenance phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Build architecture
      jsonPath: .status.arch
      name: Arch
      type: string
    - description: Machine hostname
      jsonPath: .status.hostname
      name: Host
      type: string
    - description: Primary IP
      jsonPath: .status.ip
      name: IP
      type: string
    - description: Active builds
      jsonPath: .status.activeBuilds
      name: Active
      type: integer
    - description: Build capacity
      jsonPath: .spec.capacity
      name: Capacity
      type: integer
    - description: Online duration
      jsonPath: .status.connectedSince
      name: Online
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MacAgent is the Schema for the macagents API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MacAgentSpec defines the desired scheduling state of a macOS
              worker.
            properties:
              capacity:
                default: 1
                description: Capacity is the maximum number of concurrent builds this
                  agent accepts.
                format: int32
                maximum: 8
                minimum: 1
                type: integer
              drain:
                description: |-
                  Drain stops new assignments and waits for active builds to finish before
                  the machine is upgraded or taken offline. It does not kill active builds.
                type: boolean
              minFreeDiskBytes:
                default: 21474836480
                description: |-
                  MinFreeDiskBytes is the free-disk threshold below which the scheduler no
                  longer assigns new builds to this agent.
                format: int64
                minimum: 1073741824
                type: integer
              offlineGracePeriod:
                description: |-
                  OfflineGracePeriod is how long a running build assigned to this agent is
                  kept alive after the agent stops heartbeating. When it expires the build
                  is marked Failed(AgentLost).
                type: string
                x-kubernetes-validations:
                - message: offlineGracePeriod must be between 1m and 1h
                  rule: duration(self) >= duration('1m') && duration(self) <= duration('1h')
              unschedulable:
                description: |-
                  Unschedulable stops new builds from being assigned to this agent while
                  letting active builds continue. It is the cordon switch.
                type: boolean
            type: object
          status:
            description: MacAgentStatus defines the observed state of a macOS worker.
            properties:
              activeBuilds:
                description: ActiveBuilds is the number of non-terminal builds assigned
                  to this agent.
                format: int32
                type: integer
              addresses:
                description: Addresses lists the machine's addresses (InternalIP,
                  Hostname).
                items:
                  description: MacAgentAddress is one address advertised by a macOS
                    worker.
                  properties:
                    address:
                      description: Address is the address value.
                      type: string
                    type:
                      description: Type is the address type.
                      enum:
                      - InternalIP
                      - Hostname
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              agentVersion:
                description: AgentVersion is the version of the agent binary reporting
                  this status.
                type: string
              arch:
                description: Arch is the CPU architecture this agent can build for.
                enum:
                - amd64
                - arm64
                type: string
              assignedBuilds:
                description: AssignedBuilds lists the non-terminal builds currently
                  assigned to this agent.
                items:
                  description: MacBuildReference identifies a MacBuild in a namespace.
                  properties:
                    name:
                      description: Name is the MacBuild name.
                      type: string
                    namespace:
                      description: Namespace is the MacBuild namespace.
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: Conditions represent the latest observations of the agent
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectedSince:
                description: ConnectedSince is when the current agent process first
                  registered.
                format: date-time
                type: string
              hardware:
                description: Hardware describes the machine's static specifications.
                properties:
                  cpuCores:
                    description: CPUCores is the number of logical CPUs.
                    format: int32
                    type: integer
                  cpuModel:
                    description: CPUModel is the CPU brand string.
                    type: string
                  diskTotalBytes:
                    description: DiskTotalBytes is the total size of the root filesystem.
                    format: int64
                    type: integer
                  memoryBytes:
                    description: MemoryBytes is the physical memory size.
                    format: int64
                    type: integer
                  model:
                    description: Model is the hardware model identifier (sysctl hw.model).
                    type: string
                type: object
              hostname:
                description: Hostname is the machine's current hostname.
                type: string
              instanceID:
                description: |-
                  InstanceID identifies the current agent process. It changes on restart and
                  helps detect duplicate agents using the same machine identity.
                type: string
              ip:
                description: IP is the primary IPv4 address of the machine.
                type: string
              lastAssignedAt:
                description: LastAssignedAt is when the scheduler last assigned a
                  build to this agent.
                format: date-time
                type: string
              lastHeartbeatTime:
                description: LastHeartbeatTime is the last heartbeat observed from
                  the agent.
                format: date-time
                type: string
              machineID:
                description: MachineID records which stable identifier was used for
                  this agent.
                properties:
                  source:
                    description: Source is the identifier source.
                    enum:
                    - platform-uuid
                    - serial
                    - hostname
                    type: string
                  value:
                    description: Value is the raw identifier value.
                    type: string
                type: object
              onlineDuration:
                description: OnlineDuration is the controller-rendered online duration
                  for describe output.
                type: string
              os:
                description: OS describes the macOS version.
                properties:
                  build:
                    description: Build is the macOS build version (sw_vers -buildVersion).
                    type: string
                  kernel:
                    description: Kernel is the kernel version (uname -r).
                    type: string
                  version:
                    description: Version is the macOS product version (sw_vers -productVersion).
                    type: string
                type: object
              phase:
                description: Phase summarizes heartbeat and maintenance state.
                enum:
                - Online
                - Cordoned
                - Draining
                - Drained
                - Offline
                - Unknown
                type: string
              runtime:
                description: Runtime describes the machine's current resource usage.
                properties:
                  diskFreeBytes:
                    description: DiskFreeBytes is the free space on the root filesystem.
                    format: int64
                    type: integer
                  diskFreePercent:
                    description: DiskFreePercent is the free-space percentage on the
                      root filesystem.
                    format: int32
                    type: integer
                  load1:
                    description: Load1 is the 1-minute load average.
                    type: number
                  load5:
                    description: Load5 is the 5-minute load average.
                    type: number
                  load15:
                    description: Load15 is the 15-minute load average.
                    type: number
                type: object
              stats:
                description: Stats contains best-effort lifetime counters.
                properties:
                  completed:
                    description: Completed is the number of successful builds observed
                      on this agent.
                    format: int64
                    type: integer
                  failed:
                    description: Failed is the number of failed builds observed on
                      this agent.
                    format: int64
                    type: integer
                type: object
              summary:
                description: Summary is a one-line human-readable machine summary
                  for kubectl describe.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
