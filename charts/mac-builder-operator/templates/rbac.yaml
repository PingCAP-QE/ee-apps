{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mac-builder-operator.fullname" . }}-manager
  labels:
    {{- include "mac-builder-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - build.tibuild.pingcap.net
    resources:
      - macbuilds
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - build.tibuild.pingcap.net
    resources:
      - macbuilds/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - build.tibuild.pingcap.net
    resources:
      - macbuilds/finalizers
    verbs:
      - update
  - apiGroups:
      - tekton.dev
    resources:
      - customruns
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - tekton.dev
    resources:
      - customruns/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mac-builder-operator.fullname" . }}-manager
  labels:
    {{- include "mac-builder-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mac-builder-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "mac-builder-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
