# Default values for mac-builder-operator.

replicaCount: 1

image:
  repository: ghcr.io/pingcap-qe/ee-apps/mac-builder-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Controllers to run in this Deployment. In the cluster (GC mode) run gc +
# customRun; on a macOS worker run only agent.
controller:
  agent: false
  gc: true
  customRun: true

# Namespace where the CustomRun controller creates MacBuild objects.
# Defaults to the release namespace when empty.
macBuildNamespace: ""

agent:
  # Defaults to the pod hostname when empty.
  workerName: ""
  workerArch: ""
  buildTimeout: 24h
  buildPollInterval: 5m

artifactsRepo:
  url: https://github.com/PingCAP-QE/artifacts.git
  revision: 99e1b3dd576eecb71e7e56f83aac3fd158af3468
  commit: 99e1b3dd576eecb71e7e56f83aac3fd158af3468

customRun:
  pollInterval: 30s

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: true

# External macOS worker agents run outside the cluster (the in-cluster agent is
# controller.agent above). Enable this to create a dedicated, least-privilege
# ServiceAccount + RBAC for those workers, plus an optional long-lived token
# Secret used to assemble a gcloud-free kubeconfig on the worker.
worker:
  create: false
  serviceAccount:
    # Defaults to <fullname>-worker.
    name: ""
    # Namespace for the worker SA/Role. Defaults to macBuildNamespace.
    namespace: ""
    annotations: {}
  token:
    # Create a kubernetes.io/service-account-token Secret for the worker SA.
    create: false
    # Defaults to <fullname>-worker-token.
    name: ""

crd:
  create: true

metrics:
  enabled: true
  secure: true
  service:
    enabled: true
    port: 8443
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

networkPolicy:
  enabled: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
