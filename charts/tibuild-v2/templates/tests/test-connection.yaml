{{- if .Values.server.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "tibuild-v2.fullname" . }}-test-connection"
  labels:
    {{- include "tibuild-v2.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['sh', '-c']
      # Retry: the test Pod can start before the Service endpoints are
      # programmed, which otherwise leaves wget hanging forever.
      args:
        - >-
          wget -T 5 -t 6 -qO-
          http://{{ include "tibuild-v2.fullname" . }}:{{ .Values.service.port }}/healthz
  restartPolicy: Never
{{- end }}
