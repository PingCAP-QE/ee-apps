replicaCount: 1

image:
  repository: ghcr.io/pingcap-qe/ee-apps/ci-dashboard
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
# Each constraint must select this release's pods. For the default release, use:
# labelSelector:
#   matchLabels:
#     app.kubernetes.io/name: ci-dashboard
#     app.kubernetes.io/instance: ci-dashboard
topologySpreadConstraints: []

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

containerPort: 8000

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - kind: Gateway
      name: external-https
      namespace: infra
  hostnames:
    - prow.tidb.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dashboard
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

env:
  - name: CI_DASHBOARD_LOG_LEVEL
    value: INFO

secretEnvFrom: []

ssl:
  caSecretName: ""
  caSecretKey: ca.crt
  mountPath: /var/run/ci-dashboard/ssl

command: []
args: []

extraVolumeMounts: []
extraVolumes: []

resources: {}

livenessProbe:
  httpGet:
    path: /livez
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 6
  failureThreshold: 2

# With minAvailable: 1, enable only when the effective replica count
# (replicaCount or autoscaling.minReplicas) is at least 2. Otherwise it blocks
# voluntary eviction of the sole pod.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage:

# Set rollingUpdate.maxSurge: 1 and rollingUpdate.maxUnavailable: 0 for a
# zero-unavailable rolling update.
strategy: {}

nodeSelector: {}

tolerations: []

affinity: {}
