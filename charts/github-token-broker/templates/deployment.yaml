{{- if ne .Values.server.address ":8080" -}}
{{- fail "server.address must be :8080 to match the HTTP container port and probes" -}}
{{- end -}}
{{- if .Values.server.tls.enabled -}}
{{- $port := int .Values.server.tls.port -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString .Values.server.tls.port))) (lt $port 1024) (gt $port 65535) (eq $port 8080) -}}
{{- fail "server.tls.port must be an unprivileged integer from 1024 to 65535, different from HTTP port 8080" -}}
{{- end -}}
{{- $servicePort := int .Values.service.httpsPort -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString .Values.service.httpsPort))) (lt $servicePort 1) (gt $servicePort 65535) (eq $servicePort (int .Values.service.port)) -}}
{{- fail "service.httpsPort must be an integer from 1 to 65535, different from service.port" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-token-broker.fullname" . }}
  labels:
    {{- include "github-token-broker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "github-token-broker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "github-token-broker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "github-token-broker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 20
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config
            - /etc/github-token-broker/config.yaml
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.server.tls.enabled }}
            - name: https
              containerPort: {{ .Values.server.tls.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/github-token-broker
              readOnly: true
            - name: github-app-credentials
              mountPath: /etc/github-token-broker/credentials
              readOnly: true
            {{- if .Values.server.tls.enabled }}
            - name: tls
              mountPath: /etc/github-token-broker/tls
              readOnly: true
            {{- end }}
            {{- if .Values.github.fallback.enabled }}
            - name: github-fallback-pat
              mountPath: /etc/github-token-broker/fallback
              readOnly: true
            {{- end }}
            {{- if or .Values.policy.existingSecret .Values.policy.existingConfigMap }}
            - name: policy
              mountPath: /etc/github-token-broker/policy
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "github-token-broker.fullname" . }}
        - name: github-app-credentials
          secret:
            secretName: {{ .Values.github.credentialsSecret.name }}
        {{- if .Values.server.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "server.tls.existingSecret is required when TLS is enabled" .Values.server.tls.existingSecret | quote }}
            items:
              - key: {{ required "server.tls.certKey is required when TLS is enabled" .Values.server.tls.certKey | quote }}
                path: tls.crt
              - key: {{ required "server.tls.keyKey is required when TLS is enabled" .Values.server.tls.keyKey | quote }}
                path: tls.key
        {{- end }}
        {{- if .Values.github.fallback.enabled }}
        - name: github-fallback-pat
          secret:
            secretName: {{ .Values.github.fallback.secretName }}
        {{- end }}
        {{- if .Values.policy.existingSecret }}
        - name: policy
          secret:
            secretName: {{ .Values.policy.existingSecret }}
        {{- else if .Values.policy.existingConfigMap }}
        - name: policy
          configMap:
            name: {{ .Values.policy.existingConfigMap }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
