{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "github-token-broker.fullname" . }}
  labels:
    {{- include "github-token-broker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "github-token-broker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    {{- if .Values.networkPolicy.ingressNamespaces }}
    # Plaintext callers: port 8080 only. The TLS port is never added here, so a
    # consumer of the HTTP listener does not implicitly reach the TLS listener.
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.server.tls.enabled }}
    {{- if .Values.networkPolicy.tlsIngressNamespaces }}
    # TLS callers: the native listener port only.
    - from:
        {{- range .Values.networkPolicy.tlsIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.tls.port }}
    {{- end }}
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
