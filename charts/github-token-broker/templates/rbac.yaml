{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "github-token-broker.fullname" . }}-tokenreview
  labels:
    {{- include "github-token-broker.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "github-token-broker.fullname" . }}-tokenreview
  labels:
    {{- include "github-token-broker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "github-token-broker.fullname" . }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "github-token-broker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
