    TidbcloudAddTidbxImageTagInTcmsRequestBody:
        title: TidbcloudAddTidbxImageTagInTcmsRequestBody
        type: object
        properties:
            github:
                type: object
                properties:
                    commit_sha:
                        type: string
                        description: full commit SHA
                        example: 031069dfc0c70e839d996c9e1cf3d34930fc662f
                        minLength: 40
                        maxLength: 40
                    full_repo:
                        type: string
                        description: full github repo name
                        example: pingcap/tidb
                    ref:
                        type: string
                        description: git ref
                        example: refs/heads/master
                description: git informations
                example:
                    commit_sha: 031069dfc0c70e839d996c9e1cf3d34930fc662f
                    full_repo: pingcap/tidb
                    ref: refs/heads/master
                required:
                    - full_repo
                    - commit_sha
            image:
                type: string
                description: container image with tag
                example: xxx.com/component:v26.3.1-nextgen
        example:
            github:
                commit_sha: 031069dfc0c70e839d996c9e1cf3d34930fc662f
                full_repo: pingcap/tidb
                ref: refs/heads/master
            image: xxx.com/component:v26.3.1-nextgen
        required:
            - image
    TidbcloudAddTidbxImageTagInTcmsResponseBody:
        title: TidbcloudAddTidbxImageTagInTcmsResponseBody
        type: object
        properties:
            branch:
                type: string
                description: github branch or tag name
                example: v26.3.1
            commitTime:
                type: string
                description: commit time of the built commit in RFC 3339, read from the image labels
                example: "2026-11-02T10:00:00+08:00"
            commitTitle:
                type: string
                description: commit message title of the built commit, read from the image labels
                example: 'fix: keep the publish lane moving'
                maxLength: 255
            imageTag:
                type: string
                description: image tag
                example: v26.3.1-nextgen
            repo:
                type: string
                description: github full repo
                example: pingcap/tidb
            sha:
                type: string
                description: github commit sha in the repo
                example: 031069dfc0c70e839d996c9e1cf3d34930fc662f
        example:
            branch: v26.3.1
            commitTime: "2026-11-02T10:00:00+08:00"
            commitTitle: 'fix: keep the publish lane moving'
            imageTag: v26.3.1-nextgen
            repo: pingcap/tidb
            sha: 031069dfc0c70e839d996c9e1cf3d34930fc662f
