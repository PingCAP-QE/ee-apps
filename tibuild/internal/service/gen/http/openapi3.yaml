tags:
    - name: artifact
      description: The artifact service provides operations to manage artifacts.
    - name: devbuild
      description: The devbuild service provides operations to manage dev builds.
    - name: hotfix
      description: The hotfix service provides operations to manage hotfix git tags.
    - name: publish
      description: The publish service plans artifact publications and tracks their per-target steps.
    - name: tidbcloud
      description: The tidbcloud service integrates TiBuild with the TiDB Cloud ops platform and TCMS.
