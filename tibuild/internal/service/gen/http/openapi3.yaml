            parameters:
                - name: page
                  in: query
                  description: The page number of items
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: The page number of items
                    default: 1
                    example: 8643281564837708069
                    format: int64
                  example: 166116814380003239
                - name: pageSize
                  in: query
                  description: Page size
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Page size
                    default: 30
                    example: 1311338111529232606
                    format: int64
                  example: 5955264771692082001
                - name: status
                  in: query
                  description: Filter by task status (PENDING, PROCESSING, SUCCEEDED, FAILED)
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Filter by task status (PENDING, PROCESSING, SUCCEEDED, FAILED)
                    example: FAILED
                    enum:
                        - PENDING
                        - PROCESSING
                        - SUCCEEDED
                        - FAILED
                  example: PENDING
                - name: sort
                  in: query
                  description: What to sort results by
                  allowEmptyValue: true
                  schema:
                    type: string
