                    default: createdAt
                    example: createdAt
                    enum:
                        - createdAt
                        - updatedAt
                  example: createdAt
                - name: direction
                  in: query
                  description: The direction of the sort
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: The direction of the sort
                    default: desc
                    example: desc
                    enum:
                        - asc
                        - desc
                  example: asc
