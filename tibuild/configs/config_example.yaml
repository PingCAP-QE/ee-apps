# A configuration file is required for this project.
# Create your own config file (default: ./config.yaml) and keep secrets out of git.
# The full list of keys lives in pkg/config/config.go (struct: config.Service).

store:
  # driver examples: mysql | sqlite3
  driver: mysql
  # mysql example:
  #   root:password@tcp(127.0.0.1:3306)/tibuild?charset=utf8mb4&parseTime=True&loc=Local
  dsn: "root:your-password@tcp(127.0.0.1:3306)/your_db_name?charset=utf8mb4&parseTime=True&loc=Local"

github:
  # Static fallback token. Keep this only for repositories not covered by the
  # token broker; leave empty when the broker covers all required repositories.
  token: ""
  # Optional in-cluster GitHub App token broker. When set, repository-scoped
  # GitHub API requests use short-lived App installation tokens.
  broker_url: ""
  # Projected ServiceAccount token used to authenticate to the broker.
  broker_token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"

# Identity headers asserted by the trusted Envoy Gateway. These values are
# optional; the service defaults to X-User-Id, X-User-Email and X-User-Name.
identity_headers:
  user_id: "X-User-Id"
  user_email: "X-User-Email"
  user_name: "X-User-Name"

# Authentication belongs to the Gateway. These two blocks decide whether this
# process believes the identity headers and whether it authorizes mutations.
identity:
  # Only enable after the Gateway strips client-supplied X-User-* headers and
  # injects verified claims. While false a header value is recorded for audit
  # and never becomes a principal, so nobody can pick which colleague to be.
  trusted_headers: false
  # Principal used when no trusted user is present. It keeps automation working
  # and is what a build records as createdBy until trusted headers exist.
  service_identity: "tibuild-v2@pingcap.com"
  service_name: "tibuild-v2"

authorization:
  # off: legacy behaviour; observe: log what would be denied; enforce: deny it.
  # Roll out as observe, watch the logs, then enforce.
  mode: "observe"
  # Who may mutate: exact addresses or "*@domain" patterns. Empty allows nobody.
  allow_principals:
    - "*@pingcap.com"
    - "tibuild-v2@pingcap.com"

jenkins:
  url: "https://<jenkins-url>"
  username: "your-jenkins-account"
  password: "your-jenkins-password"
  job_name: "<jenkins-job-name>"

tekton:
  cloudevent_endpoint: "http://localhost:8000"
  # Shared secret for authenticating the CloudEvents sent to the Tekton
  # EventListener. tibuild signs the request body with HMAC-SHA256 and sends the
  # signature in the GitHub-compatible `X-Hub-Signature-256` header; the
  # listener's `github` interceptor verifies it with a `secretRef` pointing at
  # the same value. In Kubernetes this is populated from a Secret created by
  # ee-ops (Secret Manager key `gcp_tibuild_cloudevent_hmac`); never commit a
  # real value. Empty sends unsigned events (unchanged legacy behaviour).
  cloudevent_hmac_secret: ""
  # Server-side Tekton Dashboard API base URL (usually the in-cluster Service).
  # Falls back to view_url when empty.
  api_url: "http://tekton-dashboard.tekton-pipelines.svc:9097"
  # Browser-facing Tekton Dashboard base URL, optionally protected by OIDC.
  # Falls back to api_url when empty. Do not append /#/... here.
  view_url: "https://<tekton-dashboard-url>"
  oci_file_download_url: "https://<download-service-url>/oci-file"
  reconciler_interval: "15s"
  reconciler_since: "24h"

# Lark notifications (devbuild status changes). Disabled by default.
lark:
  enabled: false
  # Optional image sync form URL. Empty disables per-tag Sync shortcuts.
  # Configure the full page URL in each environment; hotfix cards always omit it.
  image_sync_url: ""
  app_id: "cli_xxxxxxxxxxxxxxxx"
  app_secret: "your-app-secret"
  channels:
    - name: "devbuild-team"
      chat_id: "oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Devbuild request policy. Every key is optional; unset keys keep the legacy
# behaviour.
devbuild:
  # Repository namespaces a caller may name in a devbuild's `builderImg`, for
  # example:
  #   - ghcr.io/pingcap-qe
  #   - hub.pingcap.net/pingcap
  #   - us-docker.pkg.dev/pingcap-testing-account
  # Only the repository is matched; tags and digests are not restricted. A
  # trailing slash is optional and matching is case-insensitive. Empty
  # disables the check: any valid image reference is accepted.
  # Hot-reloadable: changes take effect without a restart.
  builder_image_allowed_repositories: []

  # GitHub repositories an explicit devbuild `githubRepo` may name. Entries are
  # "<owner>/<repo>" or "<owner>/*"; matching is case-insensitive.
  #
  # A non-empty list is fail-closed and must cover every value of
  # product_repo_map (the product default is used without the lookup), so add a
  # product's repository here whenever product_repo_map gains that product.
  # Empty means only an explicit value equal to the product default is allowed.
  # Hot-reloadable: changes take effect without a restart.
  github_repo_allowlist: []
  # Example:
  # github_repo_allowlist:
  #   - pingcap/tidb
  #   - tidbcloud/*

# Map product name -> GitHub repo (<org>/<repo>)
product_repo_map:
  tidb-cse: tidbcloud/tidb-cse
  pd-cse: tidbcloud/pd-cse
  tidb-operator-cse: tidbcloud/tidb-operator-cse
  cassandra-on-mysql: tidbcloud/cassandra-on-mysql
  qdrant-on-tidb: tidbcloud/qdrant-on-tidb
  pd: pingcap/pd
  tidb: pingcap/tidb

# Map image URL prefix -> mirror URL prefix
image_mirror_url_map:
  "gcr.io/": "<your-mirror>/"

# Image sync (copy) service configuration
image_sync:
  # Validation regexes for source/target image references of a sync request.
  # Empty values disable validation for the corresponding field.
  # Hot-reloadable: changes take effect without a restart.
  source_regx: '^(hub\.pingcap\.net|us-docker.pkg.dev/pingcap-testing-account/(hotfix|hub))/(pingcap|tikv)/[\w-/]+:v\d+\.\d+\.\d+-\d{8,}.*$'
  target_regx: '^((docker\.io/)?pingcap/[\w-]+|gcr\.io/pingcap-public/dbaas/[\w-]+):v\d+\.\d+\.\d+-\d{8,}.*$'
  # Worker polling interval for the async task queue (default: 10s).
  polling_rate: "10s"

# Background task executor. It runs as the standalone cmd/tibuild-worker
# deployment (charts/tibuild-v2 worker.enabled=true).
worker:
  # Unique worker identity written to claimed_by. Defaults to the hostname.
  id: ""
  # Target keys this worker claims. Empty means ["*"] (all targets).
  targets: []
  concurrency: 1
  poll_interval: "10s"
  lease: "90s"
  heartbeat: "30s"
  # Optional execution timeout; must be less than lease*0.8. Empty disables it.
  # hard_timeout: "60s"
  max_attempts: 3
  # Publication kinds this worker executes (publish_step rows).
  kinds: ["image_copy"]
  # Observability knobs. The defaults below match the values that used to be
  # hard-coded; override them to shorten an e2e run.
  metrics_interval: "15s"   # task stats / alert evaluation period
  reap_interval: "30s"      # expired-lease reclaim period
  backoff_base: "10s"       # first retry delay (doubles per attempt)
  backoff_max: "5m"         # retry delay cap
  alerts:
    # Alert delivery only; metrics keep refreshing when false.
    enabled: true
    # A target must stay backlogged this long before alerting.
    backlog_after: "10m"
    # Age of the oldest PENDING task that triggers an alert.
    oldest_pending_after: "30m"
    # A reaper event alerts for this long after it happens.
    lease_reclaim_window: "5m"
    # Minimum interval between two alerts with the same key.
    dedupe: "1h"

# Publication planner (POST /api/v2/publish/images).
publish:
  # delivery.yaml from PingCAP-QE/artifacts, synced into the cluster by Flux.
  # The file is reloaded when it changes, so a rule update needs no restart.
  delivery_config_path: /etc/delivery/delivery.yaml
  # Hostnames an `http` TiUP publish source (`from.http.url`) may point at.
  #
  # The publish worker downloads that URL and hands the bytes to
  # `tiup mirror publish` with the mirror signing key mounted, so an
  # unrestricted URL is both an SSRF primitive and a supply-chain write. The
  # policy is fail-closed: an EMPTY list rejects every `http` source. Exact
  # hostnames only; a leading `*.` also allows subdomains. Port and case are
  # ignored. The `oci` source is unaffected (it pins a tag or digest).
  #
  # Hot-reloadable: changes take effect without a restart, and are re-checked
  # when a queued step executes.
  http_source_allowed_hosts: []
  # Nightly convergence is off by default: every nightly push publishes
  # immediately. Enable it per target (staging first) to accumulate pushes and
  # publish only the newest artifact at each aligned window.
  # nightly:
  #   enabled: true
  #   tick_interval: 1m
  #   batch: 10
  #   default:
  #     window: 12h
  #     anchor: "02:00"
  #     timezone: UTC
  #     retry_after: 5m
  #     jitter: 30m
  #     on_failure: alert
  #   targets:
  #     tiup-staging:
  #       window: 1h
  #       anchor: "00:00"
  #     tiup-prod:
  #       window: 12h
  #       anchor: "02:00"

# TiDB Cloud ops and TCMS integrations. Both files are mounted from a Secret;
# the API keys never appear in this document.
# tidbcloud:
#   ops_config_file: /etc/tidbcloud/ops.yaml
#   testplatforms_config_file: /etc/tidbcloud/testplatforms.yaml
